<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
<h1> Weather App </h1>
    
    <div id="login-form">
      <h2>Login</h2>
      <input type="email" id="login-email" placeholder="Email" />
      <input type="password" id="login-password" placeholder="Password" />
      <button id="login-btn">Login</button>
      <p>Don't have an account? <span id="show-register" style="color:#03a9f4; cursor:pointer;">Register here</span></p>
      <p id="login-msg"></p>
    </div>

    
    <div id="register-form" class="hidden">
      <h2>Register</h2>
      <input type="email" id="register-email" placeholder="Email" />
      <input type="password" id="register-password" placeholder="Password" />
      <button id="register-btn">Register</button>
      <p>Already have an account? <span id="show-login" style="color:#03a9f4; cursor:pointer;">Login here</span></p>
      <p id="register-msg"></p>
    </div>

    
    <div id="city-form" class="hidden">
      <h2>Select Your City</h2>
      <input type="text" id="weather-city-input" placeholder="City Name" />
      <button id="subscribe-btn">Subscribe</button>
      <p id="subscribe-msg"></p>
    </div>

    <div id="weather-app" class="hidden">
      <div class="input-container">
        <input type="text" id="weather-city-input-2" placeholder="Enter city name"/>
        <button id="get-weather-btn">Get Weather</button>
      </div>
      <div id="weather-info" class="hidden">
        <h2 id="city-name"></h2>
        <p id="temperature"></p>
        <p id="description"></p>
      </div>
      <p id="error-message" class="hidden">City not found. Please try again.</p>
    </div>

  </div>

  <script src="index.js"></script>
</body>
</html>
